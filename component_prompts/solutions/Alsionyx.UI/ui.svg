<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect x="80" y="40" width="1040" height="620" fill="white" stroke="black" stroke-width="2"/>

  <!-- Title -->
  <text x="100" y="70" font-family="Segoe UI, sans-serif" font-size="20" fill="black">
    Modern Flat Design – Wireframe
  </text>

  <!-- Toolbar -->
  <rect x="100" y="90" width="1000" height="60" fill="none" stroke="black" stroke-width="1"/>
  <!-- Toolbar buttons -->
  <rect x="120" y="105" width="32" height="32" fill="none" stroke="black"/>
  <rect x="162" y="105" width="32" height="32" fill="none" stroke="black"/>
  <rect x="204" y="105" width="32" height="32" fill="none" stroke="black"/>
  <rect x="246" y="105" width="32" height="32" fill="none" stroke="black"/>

  <!-- RUNNING pill -->
  <rect x="310" y="108" width="120" height="28" rx="14" ry="14" fill="none" stroke="black"/>
  <text x="335" y="127" font-family="Segoe UI, sans-serif" font-size="14" fill="black">
    RUNNING
  </text>

  <!-- Left graphs area: Delta -->
  <rect x="100" y="170" width="650" height="190" fill="none" stroke="black"/>
  <text x="115" y="190" font-family="Segoe UI, sans-serif" font-size="16" fill="black">
    Delta (ΔdB)
  </text>
  <!-- Simple placeholder waveform -->
  <polyline
    points="110,330 150,260 190,290 230,240 270,280 310,220 350,260 390,230 430,270 470,250 510,290 550,260 590,300 630,270 740,290"
    fill="none" stroke="black" stroke-width="1"/>

  <!-- Left graphs area: Input Signal -->
  <rect x="100" y="380" width="650" height="190" fill="none" stroke="black"/>
  <text x="115" y="400" font-family="Segoe UI, sans-serif" font-size="16" fill="black">
    Input Signal
  </text>
  <!-- Simple placeholder waveform -->
  <polyline
    points="110,550 150,520 190,540 230,510 270,530 310,505 350,525 390,515 430,535 470,520 510,545 550,530 590,550 630,535 740,545"
    fill="none" stroke="black" stroke-width="1"/>

  <!-- Right panel: Input / Output Sources -->
  <rect x="770" y="170" width="330" height="400" fill="none" stroke="black"/>

  <!-- Input Sources -->
  <text x="785" y="195" font-family="Segoe UI, sans-serif" font-size="16" fill="black">
    Input Sources
  </text>
  <text x="795" y="220" font-family="Segoe UI, sans-serif" font-size="13" fill="black">
    ▢ AISIiter: USB Audio Device
  </text>
  <text x="795" y="240" font-family="Segoe UI, sans-serif" font-size="13" fill="black">
    ▢ ASIO Relix
  </text>
  <text x="795" y="260" font-family="Segoe UI, sans-serif" font-size="13" fill="black">
    ▢ H2 Sonmp AGO
  </text>
  <text x="795" y="280" font-family="Segoe UI, sans-serif" font-size="13" fill="black">
    ▢ ASIOforAll v2
  </text>
  <text x="795" y="305" font-family="Segoe UI, sans-serif" font-size="13" fill="black">
    ☑ Ch 1    ☑ Ch 2
  </text>

  <!-- Output Source -->
  <text x="785" y="340" font-family="Segoe UI, sans-serif" font-size="16" fill="black">
    Output Source
  </text>
  <text x="795" y="365" font-family="Segoe UI, sans-serif" font-size="13" fill="black">
    Playback File: track.wav   ☑ Loop
  </text>
  <text x="795" y="385" font-family="Segoe UI, sans-serif" font-size="13" fill="black">
    Sine Wave (Frequency: 11000 Hz)
  </text>
  <text x="795" y="405" font-family="Segoe UI, sans-serif" font-size="13" fill="black">
    Device: Relekti Audio
  </text>
  <text x="795" y="430" font-family="Segoe UI, sans-serif" font-size="13" fill="black">
    ☑ Ch 1    ☑ Ch 2
  </text>

  <!-- Footer bar -->
  <rect x="100" y="590" width="1000" height="60" fill="none" stroke="black"/>
  <text x="115" y="620" font-family="Segoe UI, sans-serif" font-size="14" fill="black">
    Δ RMS: 1.4 dB   |   Peak Diff: +3.8 dB   |   Corr: 99%
  </text>

  <!-- Snapshot button -->
  <rect x="930" y="602" width="110" height="30" fill="none" stroke="black"/>
  <text x="955" y="622" font-family="Segoe UI, sans-serif" font-size="14" fill="black">
    Snapshot
  </text>

</svg>